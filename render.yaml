services:
  - type: web
    name: sinails
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sinails-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: sinails-db
    plan: free
