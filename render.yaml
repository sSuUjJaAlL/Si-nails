services:
  - type: web
    name: sinails
    runtime: node
    plan: free
    # Include devDependencies so vite/typescript are available during build
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your Neon (or other) Postgres URL in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
